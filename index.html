<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Amana CRM</title>
  <style>
    :root {
      --green-primary: #2d7a3a;
      --whatsapp: #25d366;
      --orange: #f59e0b;
      --blue: #2563eb;
      --red: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .login-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 1000;
    }
    .login-overlay.hidden { display: none; }
    .login-box {
      background: var(--card); padding: 32px 28px; border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 380px;
    }
    .login-title {
      font-size: 22px; font-weight: 700; color: var(--green-primary);
      margin-bottom: 6px; text-align: center;
    }
    .login-sub {
      font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px;
    }
    .login-field { margin-bottom: 14px; }
    .login-field label {
      display: block; font-size: 12px; color: var(--text-muted);
      margin-bottom: 6px; font-weight: 500;
    }
    .login-field input {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 14px; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .login-field input:focus { border-color: var(--green-primary); }
    .login-error {
      background: #fef2f2; color: var(--red); padding: 10px 12px;
      border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none;
    }
    .login-error.visible { display: block; }
    .login-btn {
      width: 100%; padding: 12px; background: var(--green-primary); color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s; font-family: inherit;
    }
    .login-btn:hover { opacity: 0.92; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .container.hidden { display: none; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
      gap: 12px; flex-wrap: wrap;
    }
    .header h1 { font-size: 22px; font-weight: 700; color: var(--green-primary); }
    .header-info {
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: var(--text-muted); flex-wrap: wrap;
    }
    .refresh-btn, .logout-btn {
      border: none; padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; font-family: inherit;
    }
    .refresh-btn { background: var(--green-primary); color: white; }
    .logout-btn { background: white; color: var(--text); border: 1px solid var(--border); }
    .refresh-btn:hover, .logout-btn:hover { opacity: 0.85; }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .summary {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-bottom: 24px;
    }
    .summary-card {
      background: var(--card); border-radius: 12px; padding: 16px;
      box-shadow: var(--shadow); border-left: 4px solid var(--border);
    }
    .summary-card.near    { border-left-color: var(--orange); }
    .summary-card.today   { border-left-color: var(--blue); }
    .summary-card.overdue { border-left-color: var(--red); }
    .summary-label {
      font-size: 12px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .summary-value { font-size: 28px; font-weight: 700; }

    .blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .block {
      background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .block-header {
      padding: 14px 16px; color: white; font-weight: 700; font-size: 14px;
      text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .block-header.near    { background: var(--orange); }
    .block-header.today   { background: var(--blue); }
    .block-header.overdue { background: var(--red); }
    .block-count {
      background: rgba(255,255,255,0.25); padding: 2px 10px;
      border-radius: 10px; font-size: 13px;
    }
    .block-body { padding: 8px; max-height: 70vh; overflow-y: auto; }
    .empty {
      padding: 40px 20px; text-align: center;
      color: var(--text-muted); font-size: 14px;
    }

    .client {
      background: var(--bg); border-radius: 10px; padding: 12px;
      margin-bottom: 8px; border: 1px solid var(--border);
    }
    .client-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 8px; gap: 8px;
    }
    .client-name { font-weight: 600; font-size: 14px; flex: 1; }
    .client-contract {
      font-size: 11px; color: var(--text-muted); background: white;
      padding: 2px 8px; border-radius: 6px;
      border: 1px solid var(--border); white-space: nowrap;
    }
    .client-product {
      font-size: 12px;
      color: var(--text);
      background: white;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .client-product svg {
      width: 13px;
      height: 13px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .client-info {
      display: grid; grid-template-columns: auto 1fr;
      gap: 4px 8px; font-size: 12px; margin-bottom: 10px;
    }
    .client-info .label { color: var(--text-muted); }
    .client-info .value { font-weight: 500; }
    .client-info .amount { font-weight: 700; }
    .client-info .amount-overdue { color: var(--red); }

    .client-buttons { display: flex; gap: 6px; }
    .action-btn {
      flex: 1; padding: 9px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; text-decoration: none; transition: opacity 0.2s;
      font-family: inherit;
    }
    .action-btn:hover { opacity: 0.88; }
    .action-btn.call    { background: var(--green-primary); color: white; }
    .action-btn.whatsapp { background: var(--whatsapp); color: white; }
    .action-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    .loader { text-align: center; padding: 40px; color: var(--text-muted); }

    @media (max-width: 900px) {
      .container { padding: 12px; }
      .header h1 { font-size: 18px; }
      .summary { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .summary-card { padding: 12px; }
      .summary-value { font-size: 22px; }
      .summary-label { font-size: 10px; }
      .blocks { grid-template-columns: 1fr; }
      .block-body { max-height: none; }
    }
    @media (max-width: 480px) {
      .summary-card { padding: 10px; }
      .summary-value { font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="login-title">Amana CRM</div>
      <div class="login-sub">Войдите чтобы продолжить</div>
      <div class="login-error" id="loginError"></div>
      <div class="login-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username">
      </div>
      <div class="login-field">
        <label for="loginPassword">Пароль</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">Войти</button>
    </div>
  </div>

  <div class="container hidden" id="mainContent">
    <div class="header">
      <h1>Amana CRM</h1>
      <div class="header-info">
        <span id="updated">—</span>
        <button class="refresh-btn" id="refreshBtn" onclick="loadData()">↻ Обновить</button>
        <button class="logout-btn" onclick="doLogout()">Выйти</button>
      </div>
    </div>

    <div class="summary">
      <div class="summary-card near">
        <div class="summary-label">Ближайшие 3 дня</div>
        <div class="summary-value" id="countNear">—</div>
      </div>
      <div class="summary-card today">
        <div class="summary-label">Сегодня</div>
        <div class="summary-value" id="countToday">—</div>
      </div>
      <div class="summary-card overdue">
        <div class="summary-label">Просрочка</div>
        <div class="summary-value" id="countOverdue">—</div>
      </div>
    </div>

    <div class="blocks">
      <div class="block">
        <div class="block-header near">
          <span>Ближайшие 3 дня</span>
          <span class="block-count" id="cntNear">0</span>
        </div>
        <div class="block-body" id="listNear">
          <div class="loader">Загрузка...</div>
        </div>
      </div>

      <div class="block">
        <div class="block-header today">
          <span>Сегодня</span>
          <span class="block-count" id="cntToday">0</span>
        </div>
        <div class="block-body" id="listToday">
          <div class="loader">Загрузка...</div>
        </div>
      </div>

      <div class="block">
        <div class="block-header overdue">
          <span>Просрочка</span>
          <span class="block-count" id="cntOverdue">0</span>
        </div>
        <div class="block-body" id="listOverdue">
          <div class="loader">Загрузка...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCU5aOrwFH4Bfm6W--d-rG_CLLJ-BK-ixM",
      authDomain: "zvonokamana.firebaseapp.com",
      projectId: "zvonokamana",
      storageBucket: "zvonokamana.firebasestorage.app",
      messagingSenderId: "323555668050",
      appId: "1:323555668050:web:a4d974a36e29f3527c6f8b"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence);

    onAuthStateChanged(auth, function(user) {
      if (user) {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        if (typeof loadData === 'function') loadData();
      } else {
        document.getElementById('loginOverlay').classList.remove('hidden');
        document.getElementById('mainContent').classList.add('hidden');
      }
    });

    window.doLogin = function() {
      var email = document.getElementById('loginEmail').value.trim();
      var pass  = document.getElementById('loginPassword').value;
      var err   = document.getElementById('loginError');
      var btn   = document.getElementById('loginBtn');
      err.classList.remove('visible');
      if (!email || !pass) {
        err.textContent = 'Введите email и пароль';
        err.classList.add('visible');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Вход...';
      signInWithEmailAndPassword(auth, email, pass)
        .then(function() {
          btn.disabled = false;
          btn.textContent = 'Войти';
          document.getElementById('loginPassword').value = '';
        })
        .catch(function(error) {
          btn.disabled = false;
          btn.textContent = 'Войти';
          var msg = 'Ошибка входа';
          if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') msg = 'Неверный email или пароль';
          else if (error.code === 'auth/user-not-found') msg = 'Пользователь не найден';
          else if (error.code === 'auth/too-many-requests') msg = 'Слишком много попыток. Попробуйте позже.';
          else if (error.code === 'auth/network-request-failed') msg = 'Ошибка сети';
          err.textContent = msg;
          err.classList.add('visible');
        });
    };
    window.doLogout = function() { signOut(auth); };

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !document.getElementById('loginOverlay').classList.contains('hidden')) {
        window.doLogin();
      }
    });
  </script>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbybRqispPcNEXPnoUL_-AFR3HmNHT9uNyVeZ1T7w6UbMWqcyMRCSCC90Ji9ssG8O1RDow/exec';

    function buildWhatsAppText(c, type) {
      var firstName = (c.name || '').split(' ')[1] || c.name || 'клиент';
      var amount = fmtNum(c.amount);
      if (type === 'near') {
        return 'Здравствуйте, ' + firstName + '! Напоминаем: ' + (c.paymentDate || '')
          + ' у вас платёж по договору №' + c.contract
          + ' в сумме ' + amount + ' ₽. Просим внести оплату вовремя. Amana Finance';
      }
      if (type === 'today') {
        return 'Здравствуйте, ' + firstName + '! Сегодня день оплаты по договору №' + c.contract
          + ' в сумме ' + amount + ' ₽. Просим внести платёж до конца дня. Amana Finance';
      }
      if (type === 'overdue') {
        return 'Здравствуйте, ' + firstName + '! У вас просроченный платёж по договору №' + c.contract
          + ' в сумме ' + amount + ' ₽. Просим погасить задолженность как можно скорее. Amana Finance';
      }
      return '';
    }

    function fmtNum(n) {
      return (parseFloat(n) || 0).toLocaleString('ru-RU');
    }

    function fmtPhone(phone) {
      if (!phone) return '';
      var p = phone.replace(/\D/g, '');
      if (p.length === 11) {
        return '+7 (' + p.slice(1,4) + ') ' + p.slice(4,7) + '-' + p.slice(7,9) + '-' + p.slice(9);
      }
      return phone;
    }

    function normalizePhone(phone) {
      if (!phone) return '';
      var p = phone.replace(/\D/g, '');
      if (p.length === 11 && p.charAt(0) === '8') p = '7' + p.substring(1);
      return p;
    }

    function svgPhone() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
    }

    function svgWhatsapp() {
      return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>';
    }

    function svgBox() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';
    }

    function clientCard(c, type) {
      var amountClass = type === 'overdue' ? 'amount amount-overdue' : 'amount';
      var amountLabel = type === 'overdue' ? 'Просрочка' : 'Сумма';
      var dateRow = (type !== 'overdue' && c.paymentDate)
        ? '<span class="label">Оплата:</span><span class="value">' + c.paymentDate + '</span>'
        : '';

      var productBlock = c.product
        ? '<div class="client-product">' + svgBox() + '<span>' + c.product + '</span></div>'
        : '';

      var buttons = '';
      if (c.phone) {
        var waPhone = normalizePhone(c.phone);
        buttons += '<a class="action-btn call" href="tel:+' + waPhone + '">' + svgPhone() + 'Звонок</a>';
        var waText = buildWhatsAppText(c, type);
        var waUrl = 'https://wa.me/' + waPhone + '?text=' + encodeURIComponent(waText);
        buttons += '<a class="action-btn whatsapp" href="' + waUrl + '" target="_blank" rel="noopener">' + svgWhatsapp() + 'WhatsApp</a>';
      }

      return '<div class="client">' +
        '<div class="client-top">' +
          '<div class="client-name">' + (c.name || '—') + '</div>' +
          '<div class="client-contract">№ ' + c.contract + '</div>' +
        '</div>' +
        productBlock +
        '<div class="client-info">' +
          '<span class="label">' + amountLabel + ':</span>' +
          '<span class="' + amountClass + '">' + fmtNum(c.amount) + ' ₽</span>' +
          dateRow +
          (c.phone ? '<span class="label">Тел:</span><span class="value">' + fmtPhone(c.phone) + '</span>' : '') +
        '</div>' +
        (buttons ? '<div class="client-buttons">' + buttons + '</div>' : '') +
      '</div>';
    }

    function renderList(elId, list, type) {
      var el = document.getElementById(elId);
      if (!list || list.length === 0) {
        el.innerHTML = '<div class="empty">Нет клиентов</div>';
        return;
      }
      el.innerHTML = list.map(function(c) { return clientCard(c, type); }).join('');
    }

    function loadData() {
      var btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = 'Загрузка...';
      fetch(API_URL + '?action=getControl')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          btn.disabled = false;
          btn.textContent = '↻ Обновить';
          if (data.error) { alert('Ошибка: ' + data.error); return; }
          var near = data.near || [], today = data.today || [], overdue = data.overdue || [];
          document.getElementById('countNear').textContent = near.length;
          document.getElementById('countToday').textContent = today.length;
          document.getElementById('countOverdue').textContent = overdue.length;
          document.getElementById('cntNear').textContent = near.length;
          document.getElementById('cntToday').textContent = today.length;
          document.getElementById('cntOverdue').textContent = overdue.length;
          renderList('listNear', near, 'near');
          renderList('listToday', today, 'today');
          renderList('listOverdue', overdue, 'overdue');
          document.getElementById('updated').textContent = 'Обновлено: ' + (data.updated || '');
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = '↻ Обновить';
          alert('Ошибка соединения');
          console.error(err);
        });
    }
    window.loadData = loadData;
  </script>
</body>
</html>
